<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin Password Reset — Truth of Life</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:#eef6fb;color:#17334e;font:16px system-ui,-apple-system,Segoe UI,Arial,sans-serif}
    main{width:min(440px,100%);background:#fff;border:1px solid #d6e5f0;border-radius:18px;padding:24px;box-shadow:0 12px 34px #0b3c5d14}
    h1{font-size:23px;margin:0 0 8px;color:#06345d}
    p{color:#617b90;line-height:1.5}
    label{display:block;font-size:13px;font-weight:700;margin:15px 0 6px}
    input{width:100%;padding:12px;border:1px solid #cbdde9;border-radius:9px;font:inherit}
    button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:9px;background:#073b68;color:#fff;font-weight:800;font-size:15px}
    #out{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:14px;font-size:14px}
    .warning{font-size:12px;background:#fff8e7;border:1px solid #f1d48b;padding:10px;border-radius:8px;color:#6f5312}
  </style>
</head>
<body>
<main>
  <h1>Admin Password Reset</h1>
  <p>Reset the admin password for your Truth of Life website.</p>
  <div class="warning">Never share the reset token or your new password in screenshots or messages.</div>
  <form id="resetForm">
    <label for="token">Reset token</label>
    <input id="token" name="token" type="password" autocomplete="off" required>
    <label for="username">Admin username</label>
    <input id="username" name="username" value="admins" required>
    <label for="newPassword">New password (minimum 8 characters)</label>
    <input id="newPassword" name="newPassword" type="password" minlength="8" autocomplete="new-password" required>
    <button type="submit">Reset password</button>
  </form>
  <div id="out" role="status" aria-live="polite"></div>
</main>
<script>
document.getElementById("resetForm").addEventListener("submit", async event => {
  event.preventDefault();
  const form = event.currentTarget;
  const out = document.getElementById("out");
  const data = Object.fromEntries(new FormData(form));
  out.textContent = "Working…";
  try {
    const response = await fetch("/api/admin/reset-password", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      cache: "no-store",
      body: JSON.stringify(data)
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(result.error || `Request failed (${response.status}).`);
    out.textContent = result.message || "Admin password reset successfully.";
    form.reset();
    document.getElementById("username").value = "admins";
  } catch (error) {
    out.textContent = error.message || "Request failed. Check the Render deployment.";
  }
});
</script>
</body>
</html>
